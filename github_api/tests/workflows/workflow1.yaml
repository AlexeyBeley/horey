# 1. The name of the workflow as it appears in the GitHub Actions tab
name: NodeJS Continuous Integration

# 2. Trigger events: Controls when the workflow will run
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# 3. The execution block: A workflow is made of one or more jobs
jobs:
  build-and-test:
    # Specifies the type of runner (virtual machine) to use
    runs-on: ubuntu-latest

    # The sequential tasks to be executed under this job
    steps:
      # Step 1: Clone the repository code onto the runner
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Install Node.js runtime on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Optimizes speed by caching dependencies

      # Step 3: Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run linting/formatting checks
      - name: Run linter
        run: npm run lint

      # Step 5: Execute unit tests
      - name: Run tests
        run: npm test
